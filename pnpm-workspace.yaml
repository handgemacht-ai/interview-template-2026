packages:
  - 'apps/*'
  - 'libs/*'

# Dependency build scripts must be allowed explicitly, otherwise `pnpm install`
# exits 1 with ERR_PNPM_IGNORED_BUILDS and every later `pnpm <script>` fails too,
# because pnpm re-checks the dependency state before each run.
#
# Both keys are needed: pnpm 11+ reads `allowBuilds` and ignores
# `onlyBuiltDependencies`, pnpm 10.x reads only the latter. Keeping both means the
# repo installs cleanly regardless of which pnpm version a candidate has.

# pnpm 11+
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  less: true
  nx: true
  unrs-resolver: true

# pnpm 10.x
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - less
  - nx
  - unrs-resolver
